name: ${COMPOSE_PROJECT_NAME:-hr-masterdata}

services:
  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-18025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mailpit-data:
