markdownExploder: true
qa:
  qaLocation: docs/qa
prd:
  prdFile: docs/prd.md
  prdVersion: v4
  prdSharded: true
  prdShardedLocation: docs/prd
  epicFilePattern: epic-{n}*.md
architecture:
  architectureFile: docs/architecture.md
  architectureVersion: v4
  architectureSharded: true
  architectureShardedLocation: docs/architecture
customTechnicalDocuments: null
devLoadAlwaysFiles:
  - docs/architecture/coding-standards.md
  - docs/architecture/tech-stack.md
  - docs/architecture/source-tree.md
devDebugLog: .ai/debug-log.md
devStoryLocation: docs/stories
slashPrefix: BMad
localization:
  # CRITICAL: This project is Swedish-only
  defaultLanguage: sv-SE
  supportedLanguages:
    - sv-SE
  translationFile: messages/sv.json
  userFacingTextRequirement: >
    ALL user-facing text MUST be in Swedish. This includes UI labels, buttons,
    forms, error messages, notifications, table headers, modal content, and any
    text visible to end users. Use translation keys from messages/sv.json.
    No English or other language support required.
