name: Test Check

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check
        continue-on-error: false

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Run unit tests
        run: pnpm test:silent
        continue-on-error: false

      - name: Run integration tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          TEST_HR_ADMIN_EMAIL: ${{ secrets.TEST_HR_ADMIN_EMAIL || 'admin@test.com' }}
          TEST_HR_ADMIN_PASSWORD: ${{ secrets.TEST_HR_ADMIN_PASSWORD || 'Test123!' }}
          NODE_ENV: test
        run: pnpm test:integration
        continue-on-error: false
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
